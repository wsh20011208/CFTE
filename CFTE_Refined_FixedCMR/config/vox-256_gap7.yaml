dataset_params:
  root_dir: /home/jovyan/CFTE_superposition/CFTE_Refined_FixedCMR/vox
  frame_shape: [256, 256, 3]
  fixed_temporal_offset: 7
  id_sampling: True
  pairs_list: data/vox256.csv
  augmentation_params:
    flip_param:
      horizontal_flip: True
      time_flip: False
    jitter_param:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.1

model_params:
  common_params:
    num_kp: 1
    num_channels: 3
    estimate_jacobian: False
  kp_detector_params:
    temperature: 0.1
    block_expansion: 32
    max_features: 1024
    scale_factor: 0.25
    num_blocks: 5
  generator_params:
    block_expansion: 64
    max_features: 512
    num_down_blocks: 2
    num_bottleneck_blocks: 6
    estimate_occlusion_map: True
    dense_motion_params:
      block_expansion: 64
      max_features: 512
      num_down_blocks: 4
      num_bottleneck_blocks: 4
      num_blocks: 4
      scale_factor: 0.25
  discriminator_params:
    scales: [1]
    block_expansion: 32
    max_features: 512
    num_blocks: 4
    sn: True
  videocompressor_params:
    out_channel_mv: 1

train_params:
  temperature: 0.1
  num_kp: 1
  num_epochs: 200
  num_repeats: 10
  epoch_milestones: [120, 180]
  lr_generator: 2.0e-4
  lr_discriminator: 2.0e-4
  lr_kp_detector: 2.0e-4
  lr_videocompressor: 2.0e-4
  batch_size: 10
  scales: [1, 0.5, 0.25, 0.125]
  scale_factor: 0.25
  checkpoint_freq: 10

  # Identical two-reference fusion settings for the controlled ablation.
  superposition_weight_past: 0.5
  superposition_weight_future: 0.5

  loss_weights:
    generator_gan: 1
    discriminator_gan: 1
    feature_matching: [10, 10, 10, 10]
    perceptual_initial: [10, 10, 10, 10, 10]
    perceptual_final: [10, 10, 10, 10, 10]
    branch_dists: 0.25
    rdlambda: 0.0157

reconstruction_params:
  num_videos: 1000
  format: '.mp4'

animate_params:
  num_pairs: 50
  format: '.mp4'
  normalization_params:
    adapt_movement_scale: False
    use_relative_movement: True
    use_relative_jacobian: True

visualizer_params:
  kp_size: 5
  draw_border: True
  colormap: 'gist_rainbow'
