dataset_params:
  root_dir: /home/jovyan/CFTE_superposition/CFTE_Refined_AdaptiveCMR/vox
  frame_shape:
  - 256
  - 256
  - 3
  id_sampling: true
  pairs_list: data/vox256.csv
  augmentation_params:
    flip_param:
      horizontal_flip: true
      time_flip: false
    jitter_param:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.1
  fixed_temporal_offset: 7
model_params:
  common_params:
    num_kp: 1
    num_channels: 3
    estimate_jacobian: false
  kp_detector_params:
    temperature: 0.1
    block_expansion: 32
    max_features: 1024
    scale_factor: 0.25
    num_blocks: 5
  generator_params:
    block_expansion: 64
    max_features: 512
    num_down_blocks: 2
    num_bottleneck_blocks: 6
    estimate_occlusion_map: true
    dense_motion_params:
      block_expansion: 64
      max_features: 512
      num_down_blocks: 4
      num_bottleneck_blocks: 4
      num_blocks: 4
      scale_factor: 0.25
      adaptive_correction_params:
        enabled: true
        max_iterations: 15
        error_threshold: 0.0
        step_size: 0.005
        max_delta: 0.02
        gradient_normalize: true
        smooth_update: true
        smooth_kernel: 3
        accept_only_if_improved: true
        backtracking_steps: 4
        backtracking_factor: 0.5
        min_improvement: 1.0e-07
        dists_scale: 1.0
        dists_resize: true
        detach_target: true
        eps: 1.0e-06
        target_improvement: 0.015
  discriminator_params:
    scales:
    - 1
    block_expansion: 32
    max_features: 512
    num_blocks: 4
    sn: true
  videocompressor_params:
    out_channel_mv: 1
train_params:
  temperature: 0.1
  num_kp: 1
  num_epochs: 200
  num_repeats: 10
  epoch_milestones:
  - 120
  - 180
  lr_generator: 0.0002
  lr_discriminator: 0.0002
  lr_kp_detector: 0.0002
  lr_videocompressor: 0.0002
  batch_size: 8 #10 6 8 4
  scales:
  - 1
  - 0.5
  - 0.25
  - 0.125
  scale_factor: 0.25
  checkpoint_freq: 10
  superposition_weight_past: 0.5
  superposition_weight_future: 0.5
  loss_weights:
    generator_gan: 1
    discriminator_gan: 1
    feature_matching:
    - 10
    - 10
    - 10
    - 10
    perceptual_initial:
    - 10
    - 10
    - 10
    - 10
    - 10
    perceptual_final:
    - 10
    - 10
    - 10
    - 10
    - 10
    branch_dists: 0.25
    rdlambda: 0.0157
    adaptive_dists: 10.0
    adaptive_dists_sequence: 2.0
    adaptive_dists_improvement: 5.0
    adaptive_delta: 0.0001
reconstruction_params:
  num_videos: 1000
  format: .mp4
animate_params:
  num_pairs: 50
  format: .mp4
  normalization_params:
    adapt_movement_scale: false
    use_relative_movement: true
    use_relative_jacobian: true
visualizer_params:
  kp_size: 5
  draw_border: true
  colormap: gist_rainbow
